<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Glow & Care</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 360px;
            text-align: center;
        }
        h2 {
            color: #1a1a1a;
            margin-bottom: 24px;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666666;
        }
        .footer-text a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Log In</h2>

        <input type="text" id="login-email" placeholder="Enter Your Name Or Email">
        <input type="password" id="login-password" placeholder="Enter Your Password">
        <button onclick="login()">Log In</button>

        <div class="footer-text">
            Don't have an account? <a href="Signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        function login() {
            let emailInput = document.getElementById("login-email").value;
            let passInput = document.getElementById("login-password").value;

            let storedEmail = localStorage.getItem("Email");
            let storedPassword = localStorage.getItem("Password");

            if (emailInput === "" || passInput === "") {
                alert("Please fill in all fields!");
                return;
            }

            if (emailInput === storedEmail && passInput === storedPassword) {
                alert("Login successful!");
                window.location.href = "index.html"; // Yahan apni main shop page ka file name likh sakte hain
            } else {
                alert("Invalid Email or Password!");
            }
        }
    </script>
</body>
</html>
