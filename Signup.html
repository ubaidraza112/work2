<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Glow & Care</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 360px;
            text-align: center;
        }
        h2 {
            color: #1a1a1a;
            margin-bottom: 24px;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666666;
        }
        .footer-text a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create an Account</h2>

        <input type="email" id="signup-email" placeholder="Enter Your Name Or Email">
        <input type="password" id="signup-password" placeholder="Create a Password">
        <button onclick="signup()">Sign Up</button>

        <div class="footer-text">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        function signup() {
            let emailInput = document.getElementById("signup-email").value;
            let passInput = document.getElementById("signup-password").value;

            if (emailInput === "" || passInput === "") {
                alert("Please fill in all fields!");
                return;
            }

            localStorage.setItem("Email", emailInput);
            localStorage.setItem("Password", passInput);

            alert("Signup successful! You can now log in.");
            window.location.href = "login1.html";
        }
    </script>
</body>
</html>
